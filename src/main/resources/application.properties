spring.application.name=thesis-scheduler

spring.datasource.url=jdbc:postgresql://localhost:5432/thesis_scheduler_db
spring.datasource.username=thesis_app
spring.datasource.password=!September062025
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Genetic Algorithm Default Configuration
optimization.defaults.tournament-size=3
optimization.defaults.target-fitness=0.95

# Objective Function Weights
optimization.defaults.cv-weight=0.25
optimization.defaults.wb-weight=0.25
optimization.defaults.rp-weight=0.25
optimization.defaults.sp-weight=0.25

# Soft Constraint Penalty Rates
optimization.defaults.sc3-penalty-per-gap-hour=10
optimization.defaults.sc4-penalty-per-gap-hour=10
optimization.defaults.sc5-penalty-per-imbalance-hour=10
